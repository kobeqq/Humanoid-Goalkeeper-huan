# [Left_Hip_Yaw, Left_Hip_Roll, Left_Hip_Pitch, Left_Knee_Pitch, Left_Ankle_Pitch, Left_Ankle_Roll,
#  Right_Hip_Yaw, Right_Hip_Roll, Right_Hip_Pitch, Right_Knee_Pitch, Right_Ankle_Pitch, Right_Ankle_Roll]
leg_joint_indices: [12, 11, 10, 13, 14, 15, 18, 17, 16, 19, 20, 21]

command_init: [0.0, 0.0, 0.0]
command_scale: [2.8571429, 2.8571429, 2.0]
gait_phase_min_speed: 0.06
gait_phase_base_frequency: 1.15
gait_phase_speed_frequency_gain: 1.0
gait_phase_min_frequency: 1.0
gait_phase_max_frequency: 2.1

viewer_camera:
  mode: tracking
  body: Trunk
  distance: 3.0
  azimuth: 135
  elevation: -15
